<style>
  :root { --bg:#0f0f0f; --card:#171717; --fg:#f4f4f4; --sub:#8c8c8c; --line:#2a2a2a; --acc:#e53935; }
  * { box-sizing:border-box; }
  html,body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--fg); font-family:-apple-system,"Hiragino Sans","Noto Sans JP","Segoe UI",sans-serif; -webkit-font-smoothing:antialiased; }
  main { max-width:400px; margin:0 auto; padding:40px 20px 56px; }


  header { text-align:center; margin-bottom:28px; }
  .brand { font-size:12px; letter-spacing:.3em; color:var(--sub); }
  h1 { margin:10px 0 4px; font-size:30px; font-weight:600; letter-spacing:.04em; }
  .romaji { color:var(--sub); font-size:14px; letter-spacing:.08em; }

  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; overflow:hidden; }
  .row { display:flex; justify-content:space-between; align-items:baseline; gap:12px; padding:14px 16px; border-top:1px solid var(--line); font-size:15px; line-height:1.5; }
  .row:first-child { border-top:0; }
  .row .k { color:var(--sub); font-size:11px; letter-spacing:.12em; text-transform:uppercase; flex:0 0 auto; }
  .row .v { text-align:right; }
  .row .v small { display:block; color:var(--sub); font-size:12px; }
  a { color:var(--fg); text-decoration:none; }

  .links { display:flex; flex-direction:column; gap:10px; margin-top:16px; }
  .links a { display:flex; justify-content:space-between; align-items:center; padding:14px 16px; background:var(--card); border:1px solid var(--line); border-radius:12px; font-size:15px; }
  .links a span { color:var(--sub); font-size:11px; letter-spacing:.12em; text-transform:uppercase; }
  .links a:active { background:#222; }

  .btn { display:block; margin:24px 0 0; padding:16px; text-align:center; background:var(--acc); color:#fff; border-radius:12px; font-size:16px; font-weight:600; letter-spacing:.04em; }
  .btn small { display:block; font-weight:400; font-size:12px; opacity:.85; letter-spacing:.08em; }
  .foot { margin-top:28px; text-align:center; color:var(--sub); font-size:11px; letter-spacing:.06em; }
</style>
</head>
<body>
